---
- name: Check the path
  ansible.builtin.assert:
    that: fill_filesystem_path | length > 0
    fail_msg: fill_filesystem_path is required

- name: Measure the filesystem
  ansible.builtin.command:
    argv: [df, -B1, "--output=size,avail", "{{ fill_filesystem_path }}"]
  register: fill_filesystem_df
  changed_when: false

- name: Work out how much to write
  ansible.builtin.set_fact:
    fill_filesystem_size: "{{ fill_filesystem_df.stdout_lines[-1].split()[0] | int }}"
    fill_filesystem_bytes: >-
      {{ (fill_filesystem_df.stdout_lines[-1].split()[1] | int)
         - ((fill_filesystem_df.stdout_lines[-1].split()[0] | int) * (fill_filesystem_leave_free_percent | float) / 100) | int }}
    fill_filesystem_target: "{{ fill_filesystem_path }}/{{ fill_filesystem_file }}"

- name: Refuse large or already-full filesystems
  ansible.builtin.assert:
    that:
      - fill_filesystem_size | int <= fill_filesystem_max_fs_bytes | int
      - fill_filesystem_bytes | int > 0
    fail_msg: >-
      refusing to fill {{ fill_filesystem_path }}: size {{ fill_filesystem_size }} bytes
      (max_fs_bytes {{ fill_filesystem_max_fs_bytes }}), would write {{ fill_filesystem_bytes }} bytes

- name: Create the parent directory
  ansible.builtin.file:
    path: "{{ fill_filesystem_target | dirname }}"
    state: directory
    mode: "0755"

- name: Arm the revert timer
  ansible.builtin.include_role:
    name: drillbook.faults.revert_timer
    tasks_from: arm
  vars:
    revert_timer_command: "rm -f {{ fill_filesystem_target | quote }}"

- name: Write the fill file
  ansible.builtin.command:
    argv: [fallocate, -l, "{{ fill_filesystem_bytes }}", "{{ fill_filesystem_target }}"]
  changed_when: true
