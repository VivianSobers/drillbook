groups:
  - name: shop-api
    rules:
      - alert: ShopApiDown
        # absent() also covers "no pods at all", where up{} has no series to be 0.
        # absent() of a comparison carries no labels, so the rule names the service.
        expr: absent(up{job="shop-api"} == 1)
        for: 1m
        labels:
          severity: critical
          team: shop
          service: shop-api
        annotations:
          summary: shop-api has no healthy instance
          description: No shop-api target has been up for a minute. Customers cannot place orders.
          runbook_url: https://github.com/VivianSobers/drillbook/blob/main/examples/shop/runbooks/ShopApiDown.md
